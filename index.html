<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>엄마아빠콜 딥링크 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #152033;
      --muted: #5c6b80;
      --accent: #1f6feb;
      --line: #e4ebf5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(21, 32, 51, 0.06);
    }

    p.badge {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.3;
    }

    p.lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    a.button:focus-visible {
      outline: 3px solid #9cc3ff;
      outline-offset: 3px;
    }

    dl {
      margin: 28px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    div.row {
      display: grid;
      gap: 4px;
      margin-bottom: 14px;
    }

    dt {
      font-size: 12px;
      color: var(--muted);
    }

    dd {
      margin: 0;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <p class="badge">Google Play 심사용</p>
    <h1>엄마아빠콜</h1>
    <p class="lead">Android 기기에 앱을 설치한 뒤 아래 버튼을 눌러 부모님 통화 화면으로 진입해 주세요.</p>
    <a class="button" id="deeplink" href="intent://kp.mamacall/parent#Intent;scheme=kpoint;package=kr.co.knowledgepoint.MaMaCall;S.userId=tspoon;S.name=parent;S.userType=parent;S.roomId=androidRoom;S.version=2;end">딥링크 테스트 클릭</a>
    <dl>
      <div class="row">
        <dt>패키지</dt>
        <dd>kr.co.knowledgepoint.MaMaCall</dd>
      </div>
      <div class="row">
        <dt>스킴</dt>
        <dd>kpoint://kp.mamacall</dd>
      </div>
      <div class="row">
        <dt>테스트 계정</dt>
        <dd>부모 · userId tspoon (앱이 p_tspoon으로 변환) · roomId androidRoom · version 2</dd>
      </div>
    </dl>
  </main>
</body>
</html>
